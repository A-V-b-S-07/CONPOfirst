<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conpo - Informações Pessoais</title>
    <link rel="stylesheet" href="ficha.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1 class="logo">Conpo</h1>
        <a href="home.html" class="login">home</a>
    </header>

    <main>
        <section class="card">
            <h3>Nome</h3>
            <input type="text" id="nome">

            <h3>Data de nascimento</h3>
            <input type="date" id="nascimento">

            <h3>Email</h3>
            <input type="email" id="email">

            <h3>Número de telefone</h3>
            <input type="tel" id="telefone">
        </section>

        <section class="card">
            <h3>Tipo sanguíneo</h3>
            <input type="text" id="tipo">

            <h3>Alergias</h3>
            <textarea id="alergias"></textarea>

            <h3>Complicações de saúde</h3>
            <textarea id="complicacoes"></textarea>
        </section>
    </main>

    <div class="center">
        <button onclick="salvarDados()">Salvar Informações</button>
    </div>

    <script src="ficha.js"></script>
</body>
</html>
